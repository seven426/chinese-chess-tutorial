<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小小象棋家 - 中国象棋入门</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Main Menu -->
  <div id="menu-screen" class="screen active">
    <div class="menu-bg"></div>
    <div class="menu-content">
      <h1 class="game-title">小小象棋家</h1>
      <p class="game-subtitle">中国象棋入门之旅</p>
      <div class="menu-stats">
        <div class="stat-item">
          <span class="stat-icon">🏆</span>
          <span class="stat-label">已完成</span>
          <span id="menu-completed" class="stat-value">0/25</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">⭐</span>
          <span class="stat-label">总星数</span>
          <span id="menu-stars" class="stat-value">0/75</span>
        </div>
        <div class="stat-item">
          <span class="stat-icon">🎯</span>
          <span class="stat-label">成就</span>
          <span id="menu-achievements" class="stat-value">0/10</span>
        </div>
      </div>
      <div class="menu-buttons">
        <button id="btn-start" class="btn btn-primary">开始闯关</button>
        <button id="btn-achievements" class="btn btn-secondary">成就系统</button>
        <button id="btn-reset" class="btn btn-text">重置进度</button>
      </div>
    </div>
    <div class="floating-pieces">
      <span class="float-piece" style="--delay:0s;--x:10vw;--y:20vh">車</span>
      <span class="float-piece" style="--delay:2s;--x:80vw;--y:30vh">馬</span>
      <span class="float-piece" style="--delay:4s;--x:50vw;--y:70vh">炮</span>
      <span class="float-piece" style="--delay:1s;--x:20vw;--y:80vh">兵</span>
      <span class="float-piece" style="--delay:3s;--x:70vw;--y:15vh">帅</span>
    </div>
  </div>

  <!-- Level Map -->
  <div id="map-screen" class="screen">
    <div class="map-header">
      <button id="btn-map-back" class="btn-back">◀ 返回</button>
      <h2 class="map-title">闯关地图</h2>
    </div>
    <div class="map-scroll">
      <div id="level-map" class="level-map"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <button id="btn-game-back" class="btn-back">◀ 返回</button>
      <div class="game-info">
        <span id="level-name" class="level-name">关卡名称</span>
        <div class="stars-display" id="stars-display">
          <span class="star empty">★</span>
          <span class="star empty">★</span>
          <span class="star empty">★</span>
        </div>
      </div>
      <div class="game-stats-bar">
        <span id="step-counter">步数: 0</span>
        <span id="timer">00:00</span>
        <button id="btn-hint" class="btn-hint">💡 提示</button>
        <button id="btn-restart" class="btn-restart">↺ 重开</button>
        <button id="btn-undo" class="btn-undo">↩ 悔棋</button>
      </div>
    </div>
    <div class="game-main">
      <div class="board-area">
        <div id="chess-board" class="chess-board"></div>
        <div class="board-labels">
          <span class="river-label">楚 河</span>
          <span class="river-label">汉 界</span>
        </div>
      </div>
      <div class="side-panel">
        <div class="panel-card objective-card">
          <h3>🎯 任务目标</h3>
          <p id="objective-text"></p>
        </div>
        <div class="panel-card desc-card">
          <h3>📖 知识讲解</h3>
          <p id="level-desc"></p>
        </div>
        <div class="panel-card history-card">
          <h3>📝 走棋记录</h3>
          <div id="move-history" class="move-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Achievements Screen -->
  <div id="achievements-screen" class="screen">
    <div class="achievements-header">
      <button id="btn-ach-back" class="btn-back">◀ 返回</button>
      <h2 class="achievements-title">🏅 成就殿堂</h2>
    </div>
    <div id="achievements-grid" class="achievements-grid"></div>
  </div>

  <!-- Victory Modal -->
  <div id="victory-modal" class="modal">
    <div class="modal-content victory-content">
      <div class="victory-emoji">🎉</div>
      <h2 class="victory-title">闯关成功！</h2>
      <div class="victory-stars" id="victory-stars">
        <span class="star big">★</span>
        <span class="star big">★</span>
        <span class="star big">★</span>
      </div>
      <p id="victory-stats" class="victory-stats"></p>
      <div class="victory-buttons">
        <button id="btn-replay" class="btn btn-secondary">再玩一次</button>
        <button id="btn-next-level" class="btn btn-primary">下一关</button>
      </div>
    </div>
    <canvas id="confetti-canvas"></canvas>
  </div>

  <!-- Hint Modal -->
  <div id="hint-modal" class="modal">
    <div class="modal-content hint-content">
      <h3>💡 提示</h3>
      <p id="hint-text"></p>
      <button id="btn-hint-close" class="btn btn-primary">知道了</button>
    </div>
  </div>

  <!-- AI Thinking Indicator -->
  <div id="ai-thinking" class="ai-thinking">
    <span class="ai-icon">♟</span>
    <span>黑方思考中...</span>
  </div>

  <!-- Illegal Move Hint Bubble -->
  <div id="hint-bubble" class="hint-bubble">
    <span class="hint-bubble-icon">❌</span>
    <span id="hint-bubble-text"></span>
  </div>

  <!-- Check Warning Overlay -->
  <div id="check-warning" class="check-warning"></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/chess-engine.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
